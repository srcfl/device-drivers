name: Driver request
description: Request device support or share hardware evidence
title: "[driver] "
labels: ["driver"]
body:
  - type: markdown
    attributes:
      value: |
        Share device needs and evidence here. PRs are welcome, preferably linked
        to an issue: a short Markdown proposal or a focused fix with test results.
        Hardware claims need hardware evidence. See CONTRIBUTING.md.
  - type: input
    id: device
    attributes:
      label: Device make and model
    validations:
      required: true
  - type: input
    id: protocol
    attributes:
      label: Protocol or local API
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Public protocol documentation
      description: Link public documents. Do not upload credentials or private site data.
  - type: textarea
    id: hardware
    attributes:
      label: Hardware available for testing
      description: State what you can test without posting serial numbers or addresses.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I can provide device documentation or help test on hardware.
