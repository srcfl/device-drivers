name: "teslamate_vehicle"
version: "0.2.2"
tier: community
author: "Sourceful Labs AB"
protocol: mqtt
connectivity: local
setup: [bridge]
ders: [vehicle]
control: false
tested_devices:
  - manufacturer: "Tesla"
    model_family: "Tesla Vehicle (TeslaMate)"
    variants: [Model Y, Model 3]
    regions: []
    firmware_versions: ""
    notes: "Read-only. FTW reads the car's charge level, charge limit, charging state, charge cable and place from TeslaMate over MQTT. FTW cannot control the car through it: TeslaMate only logs data and takes no commands. Use tesla_vehicle (BLE proxy) to start the car's charge, or a charger FTW can control. Set geofence to this site's TeslaMate geofence for the place. Does not wake the car. Not yet run against a car."
    min_driver_version: "0.1.0"
upstream_docs:
  - url: "https://docs.teslamate.org/docs/integrations/mqtt"
    title: "TeslaMate MQTT topics"
    kind: api_docs
    url_stability: stable
