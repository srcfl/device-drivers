    firmware_versions: ""
    notes: "Read-only. FTW reads the car's charge level, charge limit, charging state and charge cable from the official Tesla Fleet API. FTW cannot control the car through it: Tesla accepts a command only when it is signed with a key paired to the car, and this driver cannot sign. Use tesla_vehicle (BLE proxy) to start the car's charge, or a charger FTW can control. Grant the optional vehicle_location scope to report the car's distance from the site; the coordinates stay in the driver. Does not wake the car. Not yet run against a car."
