    notes: "Read-only over the hub's local HTTPS API (SECRET header, self-signed certificate pinned via tls_pin_sha256). Tested with smoke alarms and one Renova CFMT 16 A floor thermostat; radiator valves (iTRV) and room stats are not seen on hardware."
    min_driver_version: "0.1.0"
  - manufacturer: "Schneider Electric"
    model_family: "Renova Connected Thermostat 16 A"
    variants: [WDE011680]
    regions: [SE]
    firmware_versions: "1.0.59"
    notes: "Read through the Wiser hub, on electric floor heating with a 15 kOhm floor sensor, in presets P8 (floor control) and P6 (room control with floor limit). Room air temperature matched the thermostat display, and the floor sensor (after setting NTC_15K) matched an IR reading of the floor surface; room demand and output state followed the relay through a heat and cool-down cycle. The floor lower limit is decoded but was not configured."
    min_driver_version: "0.1.0"
