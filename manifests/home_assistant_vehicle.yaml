    notes: "Read-only. FTW reads the car's charge level, charge limit, charging state, charge cable and place from a message a Home Assistant automation publishes over MQTT. FTW cannot control the car through it: the driver only listens and sends nothing back to Home Assistant. Control the charge with a charger FTW can control. Tested with recorded messages from a Model Y on the Tesla Custom Integration; the cable and place fields have not run on a car. Does not wake the car."
